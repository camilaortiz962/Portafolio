<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmación | Global Seguros</title>
    <link rel="stylesheet" href="styles/Carrito.css">
</head>

<body>

    <header class="header">
        <div class="header-contenedor">

            <a href="index.html#inicio" class="logo-link">
                <img src="Imagenes/global logo.png" alt="Global Seguros" class="logo-img">
            </a>

            <nav class="menu">
                <a href="index.html#inicio" class="btn-header">Inicio</a>
            </nav>

        </div>
    </header>

    <section class="hero fondo-seccion bg-compra" id="carrito">
        <div class="overlay"></div>

        <div class="confirmacion">

            <h2>CONFIRMACIÓN</h2>

            <p class="texto">
                Por favor confirme su elección antes de continuar con su pago.
            </p>

            <h3 id="productoSeleccionado">
                Producto seleccionado
            </h3>

            <button id="botonAceptar">
                ACEPTAR
            </button>

        </div>
    </section>

    <script src="scripts/Carrito.js"></script>

</body>
</html>
