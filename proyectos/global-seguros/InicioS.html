<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Global Seguros</title>
    <link rel="stylesheet" href="styles/InicioS.css">
</head>

<body>

    <header class="header">
        <div class="header-contenedor">

            <a href="index.html#inicio" class="logo-link">
                <img src="Imagenes/global logo.png" alt="Global Seguros" class="logo-img">
            </a>

            <nav class="menu">
                <a href="index.html#inicio" class="btn-header">Inicio</a>
            </nav>

        </div>
    </header>

    <section class="inicio-sesion fondo-seccion bg-usuario" id="inicio-sesion">
        <div class="overlay"></div>

        <div class="formulario">
            <h2>INICIO DE SESIÓN</h2>

            <form id="formulario">

                <div>
                    <label for="nombre">NOMBRES Y APELLIDOS</label>
                    <input 
                        type="text" 
                        id="nombre"
                        maxlength="40"
                        placeholder="Ingrese su nombre completo"
                        required
                    >
                    <small id="errorNombre"></small>
                </div>

                <div>
                    <label for="correo">CORREO ELECTRÓNICO</label>
                    <input 
                        type="email" 
                        id="correo"
                        maxlength="50"
                        placeholder="Ingrese su correo electrónico"
                        required
                    >
                    <small id="errorCorreo"></small>
                </div>

                <div>
                    <label for="password">CONTRASEÑA</label>
                    <input 
                        type="password" 
                        id="password"
                        maxlength="20"
                        placeholder="Ingrese su contraseña"
                        required
                    >
                    <small id="errorPassword"></small>
                </div>

                <div>
                    <label for="verificarPassword">VERIFIQUE SU CONTRASEÑA</label>
                    <input 
                        type="password" 
                        id="verificarPassword"
                        maxlength="20"
                        placeholder="Verifique su contraseña"
                        required
                    >
                    <small id="mensajeVerificacion"></small>
                </div>

                <button type="submit">CREAR CUENTA</button>

            </form>
        </div>
    </section>

    <script src="scripts/InicioS.js"></script>

</body>
</html>
